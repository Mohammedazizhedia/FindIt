name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sources (repo files win)
        run: |
          unzip -o FindIt.zip -d /tmp/src
          rsync -a --ignore-existing /tmp/src/ .

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Install Cairo font
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -L -o app/src/main/assets/fonts/cairo.ttf https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace | tee build-output.txt

      - name: Inspect outputs
        if: always()
        run: |
          echo "=== APK search ===" >> build-output.txt
          find . -name "*.apk" >> build-output.txt 2>&1
          echo "=== outputs dir ===" >> build-output.txt
          ls -laR app/build/outputs/ >> build-output.txt 2>&1 || true
          tail -n 40 build-output.txt

      - name: Save build log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output.txt
          git commit -m "build log" || true
          git push

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FindIt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
