name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sources (repo files win)
        run: |
          unzip -o FindIt.zip -d /tmp/src
          rsync -a --ignore-existing /tmp/src/ .

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Install fonts
        run: |
          mkdir -p app/src/main/res/font
          for f in Regular Medium SemiBold Bold; do curl -L -o "app/src/main/res/font/cairo_$(echo $f | tr 'A-Z' 'a-z').ttf" "https://github.com/google/fonts/raw/main/ofl/cairo/static/Cairo-$f.ttf"; done
          for f in Regular Medium Bold; do curl -L -o "app/src/main/res/font/tajawal_$(echo $f | tr 'A-Z' 'a-z').ttf" "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-$f.ttf"; done
          for f in Regular Bold; do curl -L -o "app/src/main/res/font/amiri_$(echo $f | tr 'A-Z' 'a-z').ttf" "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-$f.ttf"; done

      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace > build-output.txt 2>&1
          status=$?
          tail -n 100 build-output.txt
          exit $status

      - name: Save build log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output.txt
          git commit -m "build log" || true
          git push

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FindIt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
